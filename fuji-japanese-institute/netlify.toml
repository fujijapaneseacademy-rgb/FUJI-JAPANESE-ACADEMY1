# ==========================================
# Netlify Sitemap Plugin Configuration
# ==========================================
[[plugins]]
  package = "@netlify/plugin-sitemap"
  [plugins.inputs]
    baseUrl = "https://fujijapaneseacademy.com"
    exclude = [
      './404.html',
      '404.html',
      '**/404.html',
      '**/**/404.html',
      './dist/404.html',
      'dist/404.html',
      'dist/**/404.html',
      '**/404/**',
      '404.html',
      './dist/admin/**',
      'dist/admin/**',
      '**/admin/**',
      './dist/dashboard/**',
      'dist/dashboard/**',
      '**/dashboard/**',
      './dist/login/**',
      'dist/login/**',
      '**/login/**',
      './dist/signup/**',
      'dist/signup/**',
      '**/signup/**',
      './dist/payment/**',
      'dist/payment/**',
      '**/payment/**',
      './dist/qr/**',
      'dist/qr/**',
      '**/qr/**',
      './dist/connect/**',
      'dist/connect/**',
      '**/connect/**',
      './dist/enquire/**',
      'dist/enquire/**',
      '**/enquire/**',
      './dist/forgot-password/**',
      'dist/forgot-password/**',
      '**/forgot-password/**',
      './dist/reset-password/**',
      'dist/reset-password/**',
      '**/reset-password/**',
      './dist/terms/**',
      'dist/terms/**',
      '**/terms/**',
      './dist/privacy-policy/**',
      'dist/privacy-policy/**',
      '**/privacy-policy/**'
    ]

# ==========================================
# Security & XML Header Rules
# ==========================================
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap-academy.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"
    # XSS Protection (legacy browsers)
    X-XSS-Protection = "1; mode=block"
    # Referrer Policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions Policy - restrict dangerous APIs
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self), usb=(), interest-cohort=()"
    # HSTS - force HTTPS in production
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://sdk.cashfree.com https://*.cashfree.com https://checkout.razorpay.com https://fonts.googleapis.com https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co https://ovnohmkktqlusveemydb.supabase.co https://api.resend.com https://api.cashfree.com https://sandbox.cashfree.com https://*.cashfree.com https://api.razorpay.com https://checkout.razorpay.com https://lumberjack.razorpay.com https://generativelanguage.googleapis.com https://api.emailjs.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src https://api.cashfree.com https://sandbox.cashfree.com https://*.cashfree.com https://checkout.cashfree.com https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
